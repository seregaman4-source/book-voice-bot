name: Build Local Whisper Multilingual

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build_whisper_local.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential
      - name: Clone whisper.cpp
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git
      - name: Build whisper-cli
        run: |
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper.cpp/build --config Release -j2
      - name: Download multilingual base model
        run: bash whisper.cpp/models/download-ggml-model.sh base
      - name: Prepare artifact
        run: |
          mkdir -p whisper-local/lib
          cp whisper.cpp/build/bin/whisper-cli whisper-local/
          find whisper.cpp/build -type f \( -name 'libwhisper.so*' -o -name 'libggml*.so*' \) -exec cp -L {} whisper-local/lib/ \;
          cp whisper.cpp/models/ggml-base.bin whisper-local/
          cp whisper.cpp/LICENSE whisper-local/LICENSE-whisper.cpp
          sha256sum whisper-local/whisper-cli whisper-local/ggml-base.bin whisper-local/lib/* > whisper-local/SHA256SUMS.txt
          find whisper-local -maxdepth 2 -type f -ls
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-local-base-multilingual-with-libs
          path: whisper-local/
          retention-days: 7
          compression-level: 0
