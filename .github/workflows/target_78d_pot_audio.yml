name: Target 78d POT Audio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/target_78d_pot_audio.yml']

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yt-dlp and POT provider
        run: |
          python -m pip install -U 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git bgutil
          cd bgutil/server
          npm ci
          npx tsc
      - name: Start PO token server and download audio
        run: |
          mkdir -p out
          cd bgutil/server
          nohup node build/main.js > ../../out/pot-server.log 2>&1 &
          cd ../..
          sleep 3
          curl -sS http://127.0.0.1:4416/ > out/pot-health.txt || true
          yt-dlp -v --no-playlist \
            --extractor-args 'youtube:player_client=mweb' \
            -f 'bestaudio/best' \
            -o 'out/78d19HGbxak.%(ext)s' \
            'https://www.youtube.com/watch?v=78d19HGbxak' \
            > out/ytdlp.log 2>&1 || true
          echo '--- files ---'; ls -lah out
          echo '--- ytdlp tail ---'; tail -120 out/ytdlp.log || true
          echo '--- provider ---'; tail -80 out/pot-server.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: target-78d-pot-audio
          path: out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
