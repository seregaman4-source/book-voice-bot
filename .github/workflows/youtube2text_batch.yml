name: YouTube2Text Batch

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/youtube2text_batch.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch transcripts through youtube2text
        shell: bash
        run: |
          set +e
          mkdir -p y2t
          key=$(curl -sS --max-time 20 'https://youtube2text.org/api/demo-key' | python3 -c 'import sys,json; print(json.load(sys.stdin).get("apiKey",""))')
          echo "key length=${#key}"
          ids='AEVehVDnwmw Uav9Cyj3w3Q 1OXW8Av12kM xssOvL29XgE dGfxCjYwxMo do5h6kUi7IA 6XNhZu6mJlE 78d19HGbxak KANJ5DaIwyo 3G5BV6aPhjQ j05TMAqyn4M 827ohohrP6s eNndAXWoXNQ U7X_wP4h4JI NbYXtUmIqH8 86-PCIQ-lvo XDaohGikIrk'
          for id in $ids; do
            curl -G -sS --max-time 60 \
              -H "x-api-key: $key" \
              --data-urlencode "url=https://www.youtube.com/watch?v=$id" \
              --data-urlencode 'maxChars=50000' \
              -w '%{http_code}' \
              -o "y2t/${id}.json" \
              'https://youtube2text.org/api/transcribe' > "y2t/${id}.code" &
          done
          wait
          for id in $ids; do printf '%s\t' "$id"; cat "y2t/${id}.code"; printf '\t'; wc -c < "y2t/${id}.json"; done | tee y2t/STATUS.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: youtube2text-batch
          path: y2t/
          retention-days: 7
